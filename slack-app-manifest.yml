# Create the Slack app from this file: https://api.slack.com/apps > Create New App > From a manifest.
# For a private IT channel, also add the groups:history and groups:read scopes and the message.groups event.
display_information:
  name: IT Help Desk
  description: Turns IT requests into Jira tickets and helps troubleshoot them.
  background_color: "#1f3a5f"
features:
  bot_user:
    display_name: IT Help Desk
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
